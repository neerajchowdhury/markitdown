[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markitdesk"
version = "0.1.0"
description = "Local-first GUI wrapper around Microsoft MarkItDown"
authors = [
    {name = "MarkItDesk Team"}
]
dependencies = [
    "nicegui>=1.4.0",
    "markitdown>=0.1.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]